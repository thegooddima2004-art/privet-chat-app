name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unpack Android project
        run: |
          mkdir -p android-project
          unzip -o krug-android-apk-project.zip -d android-project

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find Gradle project
        run: |
          GRADLE_DIR=$(dirname "$(find android-project -name build.gradle -type f | head -n 1)")
          if [ -z "$GRADLE_DIR" ]; then
            echo "build.gradle not found"
            find android-project -maxdepth 4 -type f | head -100
            exit 1
          fi
          echo "GRADLE_DIR=$GRADLE_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$GRADLE_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android-project/**/build/outputs/apk/**/*.apk

